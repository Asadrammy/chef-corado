services:
  - type: web
    name: chef-marketplace
    env: node
    buildCommand: export DATABASE_URL="$(node scripts/normalize-database-url.cjs)" && npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
        # Add connection pool parameters for Render's PgBouncer
        # Render will append: ?connection_limit=10&pool_timeout=20&connect_timeout=10
      - key: DATABASE_PUBLIC_URL
        sync: false
        # Optional: set this to Render's external PostgreSQL URL if the private DATABASE_URL host is unreachable.
      - key: EXTERNAL_DATABASE_URL
        sync: false
        # Optional alias supported by the app; use the exact External Database URL from Render.
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: IMAGE_STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PRISMA_ENGINE_BINARY
        value: ./node_modules/.prisma/client
